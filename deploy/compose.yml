# /opt/kinstactl-docs/compose.yml on hetzner; the host Caddy terminates TLS and proxies kinstactl.rickklaasboer.nl to 127.0.0.1:3005; update with docker compose pull && docker compose up -d
services:
    docs:
        image: ghcr.io/rickklaasboer/kinstactl-docs:latest
        restart: unless-stopped
        ports:
            - "127.0.0.1:3005:80"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
            interval: 30s
            timeout: 5s
            retries: 3
