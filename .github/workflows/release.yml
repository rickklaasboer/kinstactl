name: Release

# Every push to main releases automatically, with the bump derived from the
# Angular commits since the last tag (see .release-it.js); a push with only
# docs/chore/ci/... commits releases nothing and skips the other jobs. The
# manual trigger can force a bump. Everything happens in this single run (version
# bump, tag, GitHub release, binaries, package publish, Docker image) because a
# release created with the built-in GITHUB_TOKEN does not trigger other
# workflows - which also means the version-bump commit this workflow pushes
# back to main cannot re-trigger itself.
on:
    push:
        branches: [main]
        # Avoids a pointless release run: releases are already semantic (.release-it.ts), so docs-only merges would not release anyway.
        paths-ignore: ["docs/**"]
    workflow_dispatch:
        inputs:
            increment:
                description: Version bump
                type: choice
                default: auto (from commits)
                options:
                    - auto (from commits)
                    - patch
                    - minor
                    - major
                    - none (release the current package.json version)

concurrency:
    group: release

permissions:
    contents: read

jobs:
    release:
        name: Tag and create GitHub release
        runs-on: ubuntu-latest
        env:
            # picocolors turns ANSI colors on when CI is set; the report tests
            # (run by release-it's before:init hook) assert on plain output.
            NO_COLOR: "1"
        permissions:
            contents: write
        outputs:
            version: ${{ steps.version.outputs.version }}
            released: ${{ steps.version.outputs.released }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # release-it needs tags and history

            # A run queued behind another one (concurrency) checked out its own
            # sha, which is behind the version-bump commit the earlier run pushed.
            - name: Fast-forward to the latest main
              run: git pull --ff-only origin main

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Configure git author
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Read current version
              id: before
              run: echo "version=$(bun -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

            - name: Run release-it
              run: |
                  case "$INCREMENT" in
                    "none (release the current package.json version)") bunx release-it --no-increment --ci ;;
                    patch|minor|major) bunx release-it "$INCREMENT" --ci ;;
                    *)
                      # push events and "auto": bump from commits, except the
                      # very first release, which goes from 0.0.0 to 1.0.0
                      if [ -n "$(git tag --list 'v*')" ]; then
                        bunx release-it --ci
                      else
                        bunx release-it major --ci
                      fi
                      ;;
                  esac
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INCREMENT: ${{ inputs.increment }}

            - name: Read released version
              id: version
              run: |
                  version="$(bun -e 'console.log(require("./package.json").version)')"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  if [ "$version" != "$BEFORE" ] || [ "$INCREMENT" = "none (release the current package.json version)" ]; then
                    echo "released=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "No releasable commits since the last tag; skipping the publish jobs."
                    echo "released=false" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  BEFORE: ${{ steps.before.outputs.version }}
                  INCREMENT: ${{ inputs.increment }}

    binaries:
        name: Build standalone binaries
        runs-on: ubuntu-latest
        needs: release
        if: needs.release.outputs.released == 'true'
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: v${{ needs.release.outputs.version }}

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - run: bun install --frozen-lockfile

            - run: bun run build:bin

            - uses: actions/upload-artifact@v4
              with:
                  name: binaries
                  path: dist/bin

    # Intel macOS (darwin-x64) is built and attached but not smoke-tested here:
    # no runner label for it has been verified.
    smoke:
        name: Smoke test ${{ matrix.artifact }}
        runs-on: ${{ matrix.os }}
        needs: [release, binaries]
        permissions:
            contents: read
        strategy:
            fail-fast: true
            matrix:
                include:
                    - os: ubuntu-latest
                      artifact: kinstactl-linux-x64
                    - os: ubuntu-24.04-arm
                      artifact: kinstactl-linux-arm64
                    - os: windows-latest
                      artifact: kinstactl-windows-x64.exe
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: v${{ needs.release.outputs.version }}

            - uses: ./.github/actions/smoke
              with:
                  artifact: ${{ matrix.artifact }}
                  version: ${{ needs.release.outputs.version }}

    # Not in the needs of any other job, so it does not gate publishing: macOS
    # arm64 runner capacity on GitHub can leave the job unstarted, while it
    # still reports a broken macOS binary as a failed job.
    smoke-macos:
        name: Smoke test kinstactl-darwin-arm64
        runs-on: macos-latest
        needs: [release, binaries]
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: v${{ needs.release.outputs.version }}

            - uses: ./.github/actions/smoke
              with:
                  artifact: kinstactl-darwin-arm64
                  version: ${{ needs.release.outputs.version }}

    publish-binaries:
        name: Attach binaries to the GitHub release
        runs-on: ubuntu-latest
        needs: [release, smoke]
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: binaries
                  path: dist/bin

            - name: Upload release assets
              run: gh release upload "v$VERSION" dist/bin/* --clobber --repo "$GITHUB_REPOSITORY"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.release.outputs.version }}

    npm:
        name: Publish to npm
        runs-on: ubuntu-latest
        needs: release
        if: needs.release.outputs.released == 'true'
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: v${{ needs.release.outputs.version }}

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - run: bun install --frozen-lockfile

            - run: bun run smoke:package

            # prepack builds the package
            - name: Publish
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    docker:
        name: Publish image to ghcr.io
        runs-on: ubuntu-latest
        needs: [release, smoke]
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: v${{ needs.release.outputs.version }}

            - uses: actions/download-artifact@v4
              with:
                  name: binaries
                  path: dist/bin

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/metadata-action@v5
              id: meta
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
                      type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
                      type=raw,value=latest

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
