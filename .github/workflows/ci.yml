name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

env:
    NO_COLOR: "1"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun test
            - run: bun run typecheck
    package:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: bun install --frozen-lockfile
            - run: bun run smoke:package
