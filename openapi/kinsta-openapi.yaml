    post:
      operationId: updateRedirectRules
      summary: Update redirect rules
      security:
        - bearerAuth: []
      tags:
        - WordPress Site Environments
      parameters:
        - schema:
            type: string
            example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
          required: true
          name: env_id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/GetRedirectRulesRequest"
                - properties:
                    rules_to_update:
                      type: array
                      items:
                        type: object
                        properties:
                          domain:
                            type:
                              - string
                              - "null"
                          from:
                            type: string
                          to:
                            type: string
                          traffic_from_city:
                            type:
                              - string
                              - "null"
                          traffic_from_country:
                            type:
                              - string
                              - "null"
                          traffic_from_country_name:
                            type:
                              - string
                              - "null"
                          displayed_location:
                            type:
                              - string
                              - "null"
                          type:
                            type: string
                            enum: &a4
                              - permanent
                              - redirect
                        required:
                          - domain
                          - from
                          - to
                          - type
                        example: &a5
                          domain: kinsta.com
                          from: /redirect/from
                          to: /redirect/to
                          traffic_from_city: Nashville
                          traffic_from_country: US
                          traffic_from_country_name: United States
                          displayed_location: Nashville, United States
                          type: redirect
                    new_value:
                      type: object
                      properties:
                        domain:
                          type:
                            - string
                            - "null"
                        from:
                          type: string
                        to:
                          type: string
                        traffic_from_city:
                          type:
                            - string
                            - "null"
                        traffic_from_country:
                          type:
                            - string
                            - "null"
                        traffic_from_country_name:
                          type:
                            - string
                            - "null"
                        displayed_location:
                          type:
                            - string
                            - "null"
                        type:
                          type: string
                          enum: *a4
                      required:
                        - domain
                        - from
                        - to
                        - type
                      example: *a5
                    action_type:
                      type: string
                      enum:
                        - DELETE
                        - DELETE_ALL
                        - NEW
                        - UPDATE
                      example: UPDATE
                  required:
                    - action_type
      responses:
        "200":
          description: Successfully updated redirect rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRedirectRulesResponse"
        "400":
          description: One or more of the required parameters were not provided to the
