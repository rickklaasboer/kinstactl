    SetBotProtectionLevel-Params:
      type: object
      properties:
        env_id:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
      required:
        - env_id
    SetBotProtectionLevel-Body:
      type: object
      properties:
        level:
          type: string
          enum:
            - block-malicious-traffic
            - block-automations
            - challenge-bots
            - challenge-everyone
          description: >-
            The bot protection tier to apply to the environment:

            - `block-malicious-traffic`
              - What it does: Provides essential protection against malicious traffic.
              - Recommended for: Always-on protection from Kinsta.
            - `block-automations`
              - What it does: Blocks automated traffic while allowing humans and verified bots.
              - Recommended for: Most sites.
            - `challenge-bots`
              - What it does: Challenges suspicious automated requests while allowing legitimate traffic.
              - Recommended for: Sites seeing increased scraping, spam, or suspicious traffic.
            - `challenge-everyone`
              - What it does: All unverified traffic is challenged, including humans.
              - Recommended for: Sites under active attack or dealing with sustained abuse.
          example: block-automations
      required:
        - level
    SetBotProtectionLevel-Response:
      type: object
      properties:
        operation_id:
          type: string
          example: environment:set-bot-protection-level-54fb80af-576c-4fdc-ba4f-b596c83f15a1
        message:
          type: string
          example: Setting a bot protection level in progress. Use the operation_id to
            check the status.
        status:
          type: number
          example: 202
      required:
        - message
        - status
    GetBotProtectionLevel-Params:
      type: object
      properties:
        env_id:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
      required:
        - env_id
    BotProtectionLevelSchema:
