openapi: 3.1.0
info:
  title: Kinsta API
  version: 1.122.0
  description: pages/introduction.md
  termsOfService: https://kinsta.com/legal/terms-service/
  x-logo:
    url: https://kinsta-api-resources.s3.amazonaws.com/kinsta-api-logo-light.svg
    href: /
  x-meta:
    title: Kinsta API - Kinsta® Docs
    description: Kinsta's REST API provides a streamlined and efficient way to work
      with our platform, allowing you to efficiently retrieve data, perform
      actions, and automate tasks.
servers:
  - url: https://api.kinsta.com/v2
tags:
  - name: Company Users
    description: pages/company-users/description.md
  - name: Domains
    description: pages/domains/description.md
  - name: Available Regions
    description: pages/available-regions/description.md
  - name: API Keys
    description: pages/api-keys/description.md
  - name: Activity Logs
    description: pages/activity-logs/description.md
  - name: WordPress Sites
    description: pages/wordpress-sites/description.md
  - name: WordPress Site Environments
    description: pages/wordpress-site-environments/description.md
  - name: WordPress Site Tools
    description: pages/wordpress-site-tools/description.md
  - name: WordPress Site Themes & Plugins
    description: pages/wordpress-site-themes-plugins/description.md
  - name: WordPress Site Domains
    description: pages/wordpress-site-domains/description.md
  - name: WordPress Edge Caching
    description: pages/wordpress-edge-caching/description.md
  - name: WordPress CDN
    description: pages/wordpress-cdn/description.md
  - name: Backups
    description: pages/backups/description.md
  - name: Logs
    description: pages/logs/description.md
  - name: Additional SFTP Users
    description: pages/additional-sftp-users/description.md
  - name: Analytics
    description: pages/analytics/description.md
  - name: WordPress Bot Protection
    description: pages/wordpress-bot-protection/description.md
  - name: Operations
    description: pages/operations/description.md
  - name: Authentication
    description: pages/authentication/description.md
x-tagGroups:
  - name: Company
    tags:
      - Company Users
      - Available Regions
      - API Keys
      - Activity Logs
      - WordPress Themes & Plugins
  - name: DNS Management
    tags:
      - Domains
  - name: WordPress Hosting
    tags:
      - WordPress Sites
      - WordPress Site Environments
      - WordPress Site Tools
      - WordPress Site Themes & Plugins
      - WordPress Site Domains
      - WordPress Edge Caching
      - WordPress CDN
      - Additional SFTP Users
      - Analytics
      - Backups
      - Logs
      - WordPress Bot Protection
  - name: Utilities
    tags:
      - Operations
      - Authentication
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CompanyByIdRequestParams:
      type: object
      properties:
        id:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
      required:
        - id
    CompanyUsersResponseSchema:
      type: object
      properties:
        company:
          type: object
          properties:
            users:
              type: array
              items:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
                      email:
                        type: string
                        format: email
                        example: example@exmample.com
                      image:
                        type: string
                        format: uri
                        example: https://www.gravatar.com/avatar/205e460b479e2e5b48aec07710c08d50
                      full_name:
                        type: string
                        example: John Doe
                      type_2fa:
                        type:
                          - string
                          - "null"
                        example: email
                    required:
                      - id
                      - email
                      - image
                      - full_name
                      - type_2fa
                  capabilities:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          example: 9c1f7b2e-3d4a-4f5b-8c6d-1e2f3a4b5c6d
                        type:
                          type: string
                          example: company
                        role:
                          type: string
                          example: company-admin
                        company_id:
                          type:
                            - string
                            - "null"
                          format: uuid
                          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
                        site_id:
                          type:
                            - string
                            - "null"
                          format: uuid
                          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
                      required:
                        - id
                        - type
                        - role
                        - company_id
                        - site_id
                required:
                  - user
                  - capabilities
          required:
            - users
      required:
        - company
    StatusResponseSchema200:
      type: object
      properties:
        message:
          type: string
          example: Successfully finished request
        status:
          type: number
          example: 200
        data: {}
      required:
        - message
        - status
    StatusResponseSchema202:
      type: object
      properties:
        message:
          type: string
          example: Operation in progress
        status:
          type: number
          example: 202
        data: {}
      required:
        - message
        - status
    StatusResponseSchema400:
      type: object
      properties:
        message:
          type: string
          example: Bad request format
        status:
          type: number
          example: 400
        data: {}
      required:
        - message
        - status
    StatusResponseSchema401:
      type: object
      properties:
        message:
          type: string
          example: No or invalid API key provided to the request
        status:
          type: number
          example: 401
        data: {}
      required:
        - message
        - status
    StatusResponseSchema404:
      type: object
      properties:
        message:
          type: string
          example: Could not find data or the user does not have permissions to retrieve
            it
        status:
          type: number
          example: 404
        data: {}
      required:
        - message
        - status
    StatusResponseSchema500:
      type: object
      properties:
        message:
          type: string
          example: Error occurred while processing your request
        status:
          type: number
          example: 500
        data: {}
      required:
        - message
        - status
    CompanyUserByIdRequestParams:
      type: object
      properties:
        id:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        id_user:
          type: string
          example: 9c1e4d2a-1b3c-4f5a-8d6e-7f8a9b0c1d2e
      required:
        - id
        - id_user
    CompanyUserByIdResponseSchema:
      type: object
      properties:
        company:
          type: object
          properties:
            user_by_id:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: 9c1e4d2a-1b3c-4f5a-8d6e-7f8a9b0c1d2e
                    email:
                      type: string
                      format: email
                      example: example@example.com
                    full_name:
                      type: string
                      example: John Doe
                    type_2fa:
                      type:
                        - string
                        - "null"
                      example: email
                  required:
                    - id
                    - email
                    - full_name
                    - type_2fa
                capabilities:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        example: company-developer
                      id_company:
                        type:
                          - string
                          - "null"
                        example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
                      id_site:
                        type:
                          - string
                          - "null"
                        example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
                    required:
                      - role
                      - id_company
                      - id_site
              required:
                - user
                - capabilities
          required:
            - user_by_id
      required:
        - company
    CompanyApiKeysResponseSchema:
      type: object
      properties:
        api_keys:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
              name:
                type: string
                example: Public API Key
              status:
                type: string
                enum:
                  - active
                  - revoked
                  - expired
                example: active
              expires_at:
                type:
                  - string
                  - "null"
                example: 2028-08-21T08:15:21.872Z
            required:
              - id
              - name
              - status
              - expires_at
      required:
        - api_keys
    GetDomainsRequest:
      type: object
      properties:
        company:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
      required:
        - company
    Domain:
      type: object
      properties:
        id:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        name:
          type: string
          example: mydomain.com
        site_id:
          type:
            - string
            - "null"
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        is_active:
          type: boolean
          example: true
      required:
        - id
        - name
        - site_id
        - is_active
    CompanyDomainsSchema:
      type: object
      properties:
        company:
          type: object
          properties:
            domains:
              type: array
              items:
                $ref: "#/components/schemas/Domain"
          required:
            - domains
      required:
        - company
    DomainDnsRecordsRequestParamsSchema:
      type: object
      properties:
        domain_id:
          type: string
          format: uuid
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
      required:
        - domain_id
    DomainDnsRecord:
      type: object
      properties:
        type:
          type: string
          example: A
        name:
          type: string
          example: abc.mydomain.com
        ttl:
          type: number
          minimum: 300
          description: TTL in seconds
          example: 3600
        resource_records:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                example: 1.1.1.1
            required:
              - value
      required:
        - type
        - name
        - ttl
        - resource_records
    DomainDnsRecordsResponseSchema:
      type: object
      properties:
        domain:
          type: object
          properties:
            dns_records:
              type: array
              items:
                $ref: "#/components/schemas/DomainDnsRecord"
          required:
            - dns_records
      required:
        - domain
    CreateDomainDnsRecordResponseSchema:
      type: object
      properties:
        operation_id:
          type: string
          example: domains:create-dns-record-54fb80af-576c-4fdc-ba4f-b596c83f15a1
        message:
          type: string
          example: Creating a domain DNS record in progress
        status:
          type: number
          example: 202
      required:
        - message
        - status
    UpdateDomainDnsRecordPreGqlResultSchema:
      type: object
      properties:
        domain:
          type: object
          properties:
            dns_records:
              type: array
              items:
                $ref: "#/components/schemas/DomainDnsRecord"
          required:
            - dns_records
      required:
        - domain
    UpdateDomainDnsRecordRequestBodySchema:
      type: object
      properties:
        type:
          type: string
          example: A
        name:
          type: string
          example: abc.mydomain.com
        ttl:
          type: number
          minimum: 300
          description: TTL in seconds
          example: 3600
        new_resource_records:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                example: 1.1.1.1
            required:
              - value
        removed_resource_records:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                example: 2.2.2.2
            required:
              - value
      required:
        - type
        - name
    UpdateDomainDnsRecordResponseSchema:
      type: object
      properties:
        operation_id:
          type: string
          example: domains:update-dns-record-54fb80af-576c-4fdc-ba4f-b596c83f15a1
        message:
          type: string
          example: Updating a domain DNS record in progress
        status:
          type: number
          example: 202
      required:
        - message
        - status
    DeleteDomainDnsRecordRequestBodyTransformerSchema:
      type: object
      properties:
        type:
          type: string
          example: A
        name:
          type: string
          example: staging.mydomain.com
      required:
        - type
        - name
    DeleteDomainDnsRecordPreGqlResultSchema:
      type: object
      properties:
        domain:
          type: object
          properties:
            dns_records:
              type: array
              items:
                $ref: "#/components/schemas/DomainDnsRecord"
          required:
            - dns_records
      required:
        - domain
    DeleteDomainDnsRecordResponseSchema:
      type: object
      properties:
        operation_id:
          type: string
          example: domains:delete-dns-record-54fb80af-576c-4fdc-ba4f-b596c83f15a1
        message:
          type: string
          example: Deleting domain DNS record in progress
        status:
          type: number
          example: 202
      required:
        - message
        - status
    ClearCacheRequestBody:
      type: object
      properties:
        environment_id:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
      required:
        - environment_id
    MKClearCacheResponse:
      type: object
      properties:
        operation_id:
          type: string
          example: cache:clear-54fb80af-576c-4fdc-ba4f-b596c83f15a1
        message:
          type: string
          example: Clearing site cache in progress
        status:
          type: number
          example: 202
      required:
        - operation_id
        - message
        - status
    RestartPhpEngineRequestBody:
      type: object
      properties:
        environment_id:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
      required:
        - environment_id
    RestartPhpEngineResponse:
      type: object
      properties:
        operation_id:
          type: string
          example: php:restart-54fb80af-576c-4fdc-ba4f-b596c83f15a1
        message:
          type: string
          example: Restarting PHP in progress
        status:
          type: number
          example: 202
      required:
        - operation_id
        - message
        - status
    ModifyPhpVersionRequestBody:
      type: object
      properties:
        environment_id:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        php_version:
          type: string
          example: "8.1"
        is_opt_out_from_automatic_php_update:
          type: boolean
          example: false
      required:
        - environment_id
        - php_version
    ModifyPhpVersionResponse:
      type: object
      properties:
        operation_id:
          type: string
          example: php:modify-version-54fb80af-576c-4fdc-ba4f-b596c83f15a1
        message:
          type: string
          example: Modifying PHP version in progress
        status:
          type: number
          example: 202
      required:
        - operation_id
        - message
        - status
    cloneWPSite-Body:
      type: object
      properties:
        company:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        display_name:
          type: string
          example: Copy of First WP Site
        source_env_id:
          type: string
          example: 0010cdaf-0b94-472e-86bd-7edf6fceaa1c
      required:
        - company
        - display_name
        - source_env_id
    cloneWPSite-Response:
      type: object
      properties:
        operation_id:
          type: string
          example: site:clone-54fb80af-576c-4fdc-ba4f-b596c83f15a1
        message:
          type: string
          example: Cloning site in progress
        status:
          type: number
          example: 202
        support_reference_id:
          type: number
          example: 123456
      required:
        - message
        - status
    addPlainWPSite-Body:
      type: object
      properties:
        company:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        display_name:
          type: string
          example: First plain site
        region:
          type: string
          example: us-central1
          externalDocs:
            url: https://kinsta.com/docs/data-center-locations/
            description: See the list of available regions
      required:
        - company
        - display_name
        - region
    addPlainWPSite-Response:
      type: object
      properties:
        operation_id:
          type: string
          example: sites:add-plain-54fb80af-576c-4fdc-ba4f-b596c83f15a1
        message:
          type: string
          example: Adding plain site in progress
        status:
          type: number
          example: 202
        support_reference_id:
          type: number
          example: 123456
      required:
        - message
        - status
    addWPSite-Body:
      type: object
      properties:
        company:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        display_name:
          type: string
          example: First site
        region:
          type: string
          example: us-central1
          externalDocs:
            url: https://kinsta.com/docs/data-center-locations/
            description: See the list of available regions
        install_mode:
          type: string
          default: plain
          example: new
          enum:
            - new
            - plain
            - clone
          deprecated: true
          x-default: new
        is_subdomain_multisite:
          type: boolean
          example: false
        admin_email:
          type: string
          example: admin@example.com
        admin_password:
          type: string
          example: vJnFnN-~v)PxF[6k
        admin_user:
          type: string
          example: admin
        is_multisite:
          type: boolean
          example: false
        site_title:
          type: string
          example: My First Site
        woocommerce:
          type: boolean
          description: "Deprecated: this field is no longer recommended and will be
            removed in a future release. Do not use it for new integrations."
          example: false
          deprecated: true
        wordpressseo:
          type: boolean
          description: "Deprecated: this field is no longer recommended and will be
            removed in a future release. Do not use it for new integrations."
          example: false
          deprecated: true
        wp_language:
          type: string
          example: en_US
          externalDocs:
            url: https://translate.wordpress.org/
            description: Find your WordPress locale
      required:
        - company
        - display_name
        - region
        - install_mode
        - admin_email
        - admin_password
        - admin_user
        - site_title
        - wp_language
    addWPSite-Response:
      type: object
      properties:
        operation_id:
          type: string
          example: sites:add-54fb80af-576c-4fdc-ba4f-b596c83f15a1
        message:
          type: string
          example: Adding site in progress
        status:
          type: number
          example: 202
        support_reference_id:
          type: number
          example: 123456
        warning:
          type: string
          example: "Deprecated fields used: woocommerce, wordpressseo. These fields will
            be removed in a future release."
      required:
        - message
        - status
    IdEnvBodySchema:
      type: object
      properties:
        idEnv:
          type: string
          example: id-environment
      required:
        - idEnv
    SshConnection:
      type: object
      properties:
        ssh_port:
          type: string
          example: "808080"
        ssh_ip:
          type: object
          properties:
            external_ip:
              type: string
              example: 1xx.1xx.1xx.1xx
          required:
            - external_ip
      required:
        - ssh_port
        - ssh_ip
      description: "How to connect to SSH with SSH keys:
        [link](https://kinsta.com/docs/connect-to-ssh/#how-to-connect-to-ssh-wi\
        th-ssh-keys)."
    ContainerInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        php_engine_version:
          type: string
          example: php8.3
      required:
        - id
        - php_engine_version
    EnvSiteDomain:
      type: object
      properties:
        id:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        name:
          type: string
          example: mydomain.com
        type:
          type: string
          example: live
        site_id:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
      required:
        - id
        - name
        - type
        - site_id
    Environment:
      type: object
      properties:
        id:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        name:
          type: string
          example: live
        display_name:
          type: string
          example: Live
        is_blocked:
          type: boolean
          example: false
        id_edge_cache:
          type:
            - string
            - "null"
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        cdn_cache_id:
          type:
            - string
            - "null"
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        is_opt_out_from_automatic_php_update:
          type:
            - boolean
            - "null"
          example: false
        web_root:
          type: string
          example: /release_v1
        image_optimization_type:
          type:
            - string
            - "null"
          example: lossy
          enum:
            - off
            - lossy
            - lossless
        is_additional_sftp_accounts_enabled:
          type: boolean
          example: false
        is_premium:
          type: boolean
          example: false
        wordpress_version:
          type:
            - string
            - "null"
          example: 6.3.1
        domains:
          type: array
          items:
            $ref: "#/components/schemas/EnvSiteDomain"
        primaryDomain:
          $ref: "#/components/schemas/EnvSiteDomain"
        ssh_connection:
          $ref: "#/components/schemas/SshConnection"
        container_info:
          $ref: "#/components/schemas/ContainerInfo"
      required:
        - id
        - name
        - display_name
        - is_blocked
        - id_edge_cache
        - cdn_cache_id
        - is_opt_out_from_automatic_php_update
        - web_root
        - image_optimization_type
        - is_additional_sftp_accounts_enabled
        - is_premium
        - wordpress_version
        - domains
        - primaryDomain
        - ssh_connection
        - container_info
    getSites-Query:
      type: object
      properties:
        company:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        include_environments:
          type:
            - boolean
            - "null"
          default: false
          example: true
          x-default: true
      required:
        - company
    getSites-Site:
      type: object
      properties:
        id:
          type: string
          example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
        name:
          type: string
          example: firstsite
        display_name:
          type: string
          example: First site
        status:
          type: string
          example: live
        siteLabels:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: 54fb80af-576c-4fdc-ba4f-b596c83f15a1
              name:
                type: string
                example: Do not remove
            required:
              - id
              - name
        environments:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
      required:
        - id
        - name
        - display_name
        - status
    getSites-Response:
      type: object
      properties:
        company:
          type: object
          properties:
            sites:
              type: array
              items:
                $ref: "#/components/schemas/getSites-Site"
          required:
            - sites
      required:
        - company
    SiteById-Params:
      type: object
      properties:
