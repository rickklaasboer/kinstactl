                        description: "The traffic type: `likely_humans`, `verified_bots`, `likely_bots`,
                          `ai_crawlers`, `excessive_crawlers`, `unclassified`,
                          `automated`, `malicious`, `custom_rules`,
                          `wp_automations`."
                        example: likely_humans
                      label:
                        type: string
                        description: Human-readable name, as shown in MyKinsta.
                        example: Likely humans
                      total:
                        type: number
                        example: 6000
                    required:
                      - traffic_type
                      - label
                      - total
                results:
                  type: array
                  items:
                    type: object
                    properties:
                      result:
                        type: string
                        description: "The protection result: `blocked`, `challenged`, `allowed`."
                        example: blocked
                      label:
                        type: string
                        description: Human-readable name, as shown in MyKinsta.
                        example: Blocked
                      total:
                        type: number
                        example: 300
                    required:
                      - result
                      - label
                      - total
                flows:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: number
                  description: Requests per traffic type (key) and protection result (nested key).
                  example:
                    likely_bots:
                      allowed: 92848
                      challenged: 36720
                    likely_humans:
                      allowed: 5100
                      challenged: 600
                      blocked: 300
              required:
                - traffic_types
                - results
                - flows
          required:
            - traffic_flow
      required:
        - analytics
    BotTrafficRequests-Response:
      type: object
      properties:
        analytics:
          type: object
          properties:
            requests_over_time:
              type: array
              items:
                type: object
                properties:
                  traffic_type:
                    type: string
                    description: "The traffic type: `likely_humans`, `verified_bots`, `likely_bots`,
                      `ai_crawlers`, `excessive_crawlers`, `unclassified`,
                      `automated`, `malicious`, `custom_rules`,
                      `wp_automations`."
                    example: likely_humans
                  label:
                    type: string
                    description: Human-readable name, as shown in MyKinsta.
                    example: Likely humans
                  total:
                    type: number
                    example: 10572
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          description: Start of the bucket in ISO 8601 (UTC). Buckets are hourly for
                            `24_hours` and daily otherwise.
                          example: 2026-09-14T00:00:00.000Z
                        requests:
                          type: number
                          example: 5286
                      required:
                        - date
                        - requests
                required:
                  - traffic_type
                  - label
                  - total
                  - timeline
          required:
            - requests_over_time
      required:
        - analytics
    BotProtectionResults-Response:
      type: object
      properties:
        analytics:
          type: object
          properties:
            protection_results_over_time:
              type: array
              items:
                type: object
                properties:
                  result:
                    type: string
                    description: "The protection result: `blocked`, `challenged`, `allowed`."
                    example: blocked
                  label:
                    type: string
                    description: Human-readable name, as shown in MyKinsta.
                    example: Blocked
                  total:
                    type: number
                    example: 10572
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          description: Start of the bucket in ISO 8601 (UTC). Buckets are hourly for
                            `24_hours` and daily otherwise.
                          example: 2026-09-14T00:00:00.000Z
                        requests:
                          type: number
                          example: 5286
                      required:
                        - date
                        - requests
                required:
                  - result
                  - label
                  - total
                  - timeline
          required:
            - protection_results_over_time
      required:
        - analytics
    BotTopBreakdown-Response:
      type: object
      properties:
        analytics:
          type: object
          properties:
            top_requests_breakdown:
              type: array
              items:
                type: object
                properties:
                  traffic_type:
                    type: string
                    description: "The traffic type: `likely_humans`, `verified_bots`, `likely_bots`,
                      `ai_crawlers`, `excessive_crawlers`, `unclassified`,
                      `automated`, `malicious`, `custom_rules`,
                      `wp_automations`."
                    example: likely_humans
                  label:
                    type: string
                    description: Human-readable name, as shown in MyKinsta.
                    example: Likely humans
                  total:
                    type: number
                    description: All requests of this traffic type.
                    example: 160175
                  breakdowns:
                    type: object
                    properties:
                      top_paths:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: string
                              example: /wp-login.php
                            requests:
                              type: number
                              example: 6079
                          required:
                            - value
                            - requests
                        description: Up to 10 values with the most requests.
                      top_user_agents:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: string
                              example: Mozilla/5.0
                            requests:
                              type: number
                              example: 6079
                          required:
                            - value
                            - requests
                        description: Up to 10 values with the most requests.
                      top_countries:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: string
                              example: US
                            requests:
                              type: number
                              example: 6079
                          required:
                            - value
                            - requests
                        description: Up to 10 values with the most requests.
                      top_ips:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: string
                              example: 192.0.2.1
                            requests:
                              type: number
                              example: 6079
                          required:
                            - value
                            - requests
                        description: Up to 10 values with the most requests.
                    required:
                      - top_paths
                      - top_user_agents
                      - top_countries
                      - top_ips
                required:
                  - traffic_type
                  - label
                  - total
                  - breakdowns
          required:
            - top_requests_breakdown
      required:
        - analytics
